app = 'face-swap'
primary_region = 'gru'

[build]

[env]
  FACE_SWAP_CTX_ID = '-1'
  FACE_SWAP_MODEL_DIR = '/app/models'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 4
    soft_limit = 2

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 4

# Provision each attached volume before starting the web Machine (see README).
[[mounts]]
  source = 'face_swap_models'
  destination = '/app/models'
  initial_size = '2'
